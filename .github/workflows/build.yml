name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore -p:TargetFramework=net10.0-android

      - name: Build (Android)
        run: dotnet build --configuration Release --framework net10.0-android --no-restore

  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore
        run: dotnet restore MauiWithPrism.csproj -p:TargetFramework=net10.0-ios

      - name: Build (iOS Simulator)
        run: dotnet build MauiWithPrism.csproj --configuration Release --framework net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64 --no-restore
